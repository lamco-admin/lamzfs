[package]
name = "lamzfs"
version = "0.0.0"
edition = "2021"
authors = [
    "Greg Lamberson <greg@lamco.io>",
    "Lamco Development LLC <office@lamco.io>",
]
license = "MIT OR Apache-2.0"
description = "no_std read-only ZFS reader for UEFI bootloaders (single + mirror vdev, unencrypted bpool)"
repository = "https://github.com/lamco-admin/lamzfs"
homepage = "https://lamco.ai/products/lamboot/"
readme = "README.md"
keywords = ["zfs", "filesystem", "no_std", "uefi", "bootloader"]
categories = ["filesystem", "embedded", "no-std"]
rust-version = "1.85"
documentation = "https://docs.rs/lamzfs"
include = [
    "src/**/*.rs",
    "README.md",
    "NOTICE",
    "CHANGELOG.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
]

[dependencies]
# Dependencies are added with the implementation (all permissive, upstream-cleared).

[features]
default = []
std = []

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]

[badges]
maintenance = { status = "actively-developed" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
elided_lifetimes_in_paths = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { priority = -1, level = "deny" }
missing_errors_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
wildcard_imports = "deny"
unwrap_used = "warn"
expect_used = "warn"
