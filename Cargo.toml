[package]
name = "lamzfs"
version = "0.0.0"
edition = "2021"
authors = [
    "Greg Lamberson <greg@lamco.io>",
    "Lamco Development LLC <office@lamco.io>",
]
license = "MIT"
description = "no_std read-only ZFS reader for UEFI bootloaders (single/mirror/raidz1, unencrypted bpool)"
repository = "https://github.com/lamco-admin/lamzfs"
homepage = "https://lamco.ai/products/lamboot/"
readme = "README.md"
keywords = ["zfs", "filesystem", "no_std", "uefi", "bootloader"]
categories = ["filesystem", "embedded", "no-std"]
rust-version = "1.87"
documentation = "https://docs.rs/lamzfs"
include = [
    "src/**/*.rs",
    "README.md",
    "NOTICE",
    "CHANGELOG.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
]

[dependencies]
# Per-block decompressors (all permissive, no_std, feature-gated). ZFS LZJB is
# carried from the vendored rzfs fork; these cover the rest of the on-disk set.
lz4_flex = { version = "0.11", default-features = false, features = ["safe-decode"], optional = true }
ruzstd = { version = "0.8", default-features = false, optional = true }
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"], optional = true }

[dev-dependencies]
# Oracle tests: decompress the committed .img.zst fixtures, hash file contents,
# and read the MANIFEST. All test-only (not shipped).
ruzstd = "0.8"
sha2 = "0.10"
serde_json = "1"

[lib]
# The vendored rzfs decoders carry hundreds of doc examples written against the
# upstream `rzfs::` crate path; they are not lamzfs's public API and do not
# compile here. lamzfs is validated by unit tests, the zpool-oracle fixtures, and
# fuzzing (SPEC-LAMZFS §6), not by doctests.
doctest = false

[features]
default = ["lz4", "zstd", "gzip", "lzjb", "mirror"]
std = []

# Per-codec gates (SPEC-LAMZFS §10). `off` and `zle` are always compiled.
lz4 = ["dep:lz4_flex"]
zstd = ["dep:ruzstd"]
gzip = ["dep:miniz_oxide"]
lzjb = []
mirror = []

# NOTE: the vendored rzfs subtree gates SIMD-accelerated checksums behind feature
# names like `sha256-avx2` / `fletcher4-avx512f`. lamzfs deliberately does NOT
# declare them: every accelerator path requires `unsafe`, which the crate forbids
# (`#![forbid(unsafe_code)]`), so only the scalar Fletcher-2/4 + SHA-256 path is
# ever compiled (SPEC-LAMZFS §5.1). Declaring them would make `--all-features`
# (used by CI *and* docs.rs) try to build the `unsafe` paths and fail the gate.
# The now-unknown `cfg(feature = ...)` gates are permanently-false; the
# unexpected_cfgs lint is silenced in the `vendored!` wrapper (src/lib.rs).

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]

[badges]
maintenance = { status = "actively-developed" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
elided_lifetimes_in_paths = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { priority = -1, level = "deny" }
missing_errors_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
wildcard_imports = "deny"

# lamzfs parses on-disk binary structures: numeric casting between
# u8/u16/u32/u64/usize is pervasive (byte offsets, DVA fields, shift math).
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
# Doc comments reference on-disk ZFS names in prose (bpool, rpool, DVA, ZAP,
# dnode, objset, uberblock, …); backticking every one is noise.
doc_markdown = "allow"
# Field/var names mirror on-disk ZFS names; not ours to rename.
similar_names = "allow"
unreadable_literal = "allow"
match_same_arms = "allow"

# (unwrap_used / expect_used intentionally not enabled: the library read path is
# unwrap-free by construction; fixture tests use unwrap on known-good inputs.)
